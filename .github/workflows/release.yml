name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: false = candidate only (:rc-<tag>). true = promote, git tag, and GitHub release (main only).
        required: true
        default: false
        type: boolean

jobs:
  compute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build plugin runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: release-versions:runner
      - name: Compute RELEASE_TAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e PLUGIN_MODE=compute \
            -e CI_COMMIT_SHA="${GITHUB_SHA}" \
            -e CI_REPO="${GITHUB_REPOSITORY}" \
            -e PLUGIN_GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e PLUGIN_MAJOR_MINOR_SOURCE=go \
            -e PLUGIN_MAJOR_MINOR_FILE=internal/version/version.go \
            -e CI_COMMIT_BRANCH="${GITHUB_REF_NAME}" \
            release-versions:runner
      - id: release
        run: echo "release_tag=$(cat .release-tag)" >> "$GITHUB_OUTPUT"

  build-candidate:
    needs: compute
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      candidate_tag: ${{ steps.meta.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "candidate_tag=ghcr.io/${{ github.repository }}:rc-${{ needs.compute.outputs.release_tag }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            RELEASE_TAG=${{ needs.compute.outputs.release_tag }}
          tags: ${{ steps.meta.outputs.candidate_tag }}

  e2e:
    needs: build-candidate
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
    with:
      plugin_image: ${{ needs.build-candidate.outputs.candidate_tag }}

  finish-candidate:
    needs: [compute, build-candidate, e2e]
    if: inputs.publish == false
    runs-on: ubuntu-latest
    steps:
      - name: Candidate release summary
        run: |
          echo "Candidate release complete."
          echo ""
          echo "  RELEASE_TAG=${{ needs.compute.outputs.release_tag }}"
          echo "  candidate=${{ needs.build-candidate.outputs.candidate_tag }}"
          echo ""
          echo "Nothing was promoted to :latest, no git tag was pushed, and no GitHub release was created."
          echo "Run this workflow again with publish=true from main to ship."

  publish:
    needs: [compute, build-candidate, e2e]
    if: inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Require main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Publish releases must run from main (current branch: ${GITHUB_REF_NAME})"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote candidate tag
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:${{ needs.compute.outputs.release_tag }} \
            --tag ghcr.io/${{ github.repository }}:latest \
            ${{ needs.build-candidate.outputs.candidate_tag }}
      - name: Build plugin runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: release-versions:runner
      - name: Push git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ needs.compute.outputs.release_tag }}" > .release-tag
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e PLUGIN_MODE=push-tag \
            -e CI_COMMIT_SHA="${GITHUB_SHA}" \
            -e CI_REPO="${GITHUB_REPOSITORY}" \
            -e PLUGIN_GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e PLUGIN_MAJOR_MINOR_SOURCE=go \
            -e CI_COMMIT_BRANCH="${GITHUB_REF_NAME}" \
            release-versions:runner
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute.outputs.release_tag }}
          generate_release_notes: true
