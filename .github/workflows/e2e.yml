name: e2e

on:
  workflow_call:
    inputs:
      plugin_image:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      plugin_image:
        description: Optional plugin image for container smoke test
        required: false
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run e2e tagged tests
        env:
          PLUGIN_IMAGE: ${{ inputs.plugin_image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test -tags=e2e -timeout 10m -v ./test/e2e/...
